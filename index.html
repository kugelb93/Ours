<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oura Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#12121a;--card:#1a1a2e;--card-h:#22223a;--bdr:#2a2a3e;--t1:#e4e4ef;--t2:#8888a0;--blue:#4f8ff7;--purple:#8b5cf6;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--cyan:#22d3ee}
body{background:var(--bg);color:var(--t1);font-family:system-ui,-apple-system,sans-serif;display:flex;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}

/* Nav */
#nav{position:fixed;left:0;top:0;height:100%;width:220px;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;z-index:50}
#nav .logo{padding:20px;border-bottom:1px solid var(--bdr)}
#nav .logo h1{font-size:18px;font-weight:700;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#nav .logo p{font-size:10px;color:var(--t2);margin-top:2px}
#nav .links{flex:1;padding-top:12px;overflow-y:auto}
#nav .links button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 20px;font-size:14px;border:none;background:transparent;color:var(--t2);border-right:2px solid transparent;transition:all .15s}
#nav .links button:hover{color:var(--t1);background:var(--card)}
#nav .links button.active{color:var(--blue);background:rgba(79,143,247,.1);border-right-color:var(--blue)}
#nav .links button .icon{font-size:16px;width:20px;text-align:center}
#nav .foot{padding:16px;border-top:1px solid var(--bdr)}
#nav .foot button{font-size:10px;color:var(--t2);background:none;border:none}
#nav .foot button:hover{color:var(--red)}
#nav .foot p{font-size:10px;color:var(--t2);margin-top:8px}

/* Main */
#main{margin-left:220px;flex:1;padding:24px;min-height:100vh}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.page-header h2{font-size:24px;font-weight:700}
.page-header p{font-size:13px;color:var(--t2);margin-top:4px}

/* Cards */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:20px}
.card-title{font-size:14px;font-weight:600;margin-bottom:4px}
.card-sub{font-size:11px;color:var(--t2);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}

/* Metrics */
.metric-label{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.metric-val{font-size:24px;font-weight:700}
.metric-unit{font-size:13px;color:var(--t2);margin-left:4px}

/* Date selector */
.date-sel{display:flex;gap:4px;background:var(--bg2);border-radius:8px;padding:4px}
.date-sel button{padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;border:none;background:transparent;color:var(--t2)}
.date-sel button.active{background:var(--blue);color:#fff}

/* Score ring */
.ring-wrap{position:relative;display:inline-block}
.ring-wrap .ring-text{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700}
.score-ring{transform:rotate(-90deg)}

/* Charts */
.chart-container{position:relative;width:100%;overflow:hidden}
canvas{display:block;width:100%!important}

/* Spinner */
.spinner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:16px}
.spinner .dot{width:32px;height:32px;border:2px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
.spinner p{font-size:14px;color:var(--t2)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Token setup */
#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;width:100%}
#setup .box{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:32px;max-width:400px;width:100%;margin:16px}
#setup h1{font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px}
#setup .sub{font-size:13px;color:var(--t2);text-align:center;margin-bottom:24px}
#setup input{width:100%;padding:12px 16px;background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;font-size:14px;color:var(--t1);outline:none;margin-bottom:16px}
#setup input:focus{border-color:var(--blue)}
#setup .btn{width:100%;padding:12px;background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:500}
#setup .btn:disabled{opacity:.5}
#setup .note{font-size:10px;color:var(--t2);text-align:center;margin-top:16px}

/* Chat */
#chat-page{display:flex;flex-direction:column;height:calc(100vh - 48px)}
#chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:24px}
.chat-empty .icon{font-size:40px}
.chat-empty h3{font-size:18px;font-weight:600}
.chat-empty p{font-size:13px;color:var(--t2);max-width:400px;text-align:center;margin-top:4px}
.chat-suggestions{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:500px;width:100%}
.chat-suggestions button{text-align:left;font-size:12px;padding:12px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;color:var(--t2)}
.chat-suggestions button:hover{background:var(--card-h);color:var(--t1)}
.msg{display:flex}.msg.user{justify-content:flex-end}.msg.ai{justify-content:flex-start}
.msg .bubble{max-width:600px;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.user .bubble{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.msg.ai .bubble{background:var(--card);border:1px solid var(--bdr);color:var(--t1)}
.typing{display:flex;gap:4px;padding:12px 16px}.typing span{width:8px;height:8px;background:var(--t2);border-radius:4px;animation:bounce .6s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
#chat-form{display:flex;gap:12px;padding-top:16px;border-top:1px solid var(--bdr)}
#chat-form input{flex:1;padding:12px 16px;background:var(--card);border:1px solid var(--bdr);border-radius:12px;font-size:14px;color:var(--t1);outline:none}
#chat-form input:focus{border-color:var(--blue)}
#chat-form button{padding:12px 24px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:500}
#chat-form button:disabled{opacity:.5}

/* Contributor grid */
.contribs{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.contrib{display:flex;flex-direction:column;align-items:center;gap:6px}
.contrib span{font-size:10px;color:var(--t2);text-align:center;text-transform:capitalize;max-width:70px;line-height:1.2}

/* Workout list */
.workout-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg2);border-radius:8px}
.workout-item .name{font-size:14px;font-weight:500;text-transform:capitalize}
.workout-item .date{font-size:12px;color:var(--t2)}
.workout-stats{display:flex;gap:24px;font-size:13px}
.workout-stats .stat-label{font-size:11px;color:var(--t2)}
.workout-stats .stat-val{font-weight:500}

/* Error */
.error-box{text-align:center;padding:80px 0;color:var(--red);font-size:14px}

/* API key row for chat */
.api-key-row{display:flex;gap:8px;margin-bottom:16px}
.api-key-row input{flex:1;padding:8px 12px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;font-size:13px;color:var(--t1);outline:none}
.api-key-row button{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Oura API (via Cloudflare Worker proxy for CORS) ──
const OURA="https://api.ouraring.com";
// Deploy the worker from worker.js to your own Cloudflare account, then set the URL here.
// Or use direct API (works if CORS is allowed or running locally).
const DEFAULT_PROXY="https://ours.w-kugelberg.workers.dev/";
let PROXY_URL=(()=>{const s=localStorage.getItem("oura_proxy");return s!==null?s:DEFAULT_PROXY})();
function getApiUrl(ep,params){
  const u=new URL(`${OURA}/${ep}`);
  Object.entries(params).forEach(([k,v])=>{if(v)u.searchParams.set(k,v)});
  if(PROXY_URL){
    const p=new URL(PROXY_URL);
    p.searchParams.set("url",u.toString());
    return p.toString();
  }
  return u.toString();
}
async function ouraFetch(ep,token,params={}){
  const url=getApiUrl(ep,params);
  let r;
  try{
    r=await fetch(url,{headers:{Authorization:`Bearer ${token}`}});
  }catch(e){
    throw new Error("Network error fetching Oura data. Check the CORS proxy in Settings. ("+e.message+")");
  }
  if(!r.ok){
    const t=await r.text().catch(()=>"");
    throw new Error(`Oura ${r.status}: ${t}`);
  }
  return r.json();
}
function dateRange(d){const e=new Date(),s=new Date();s.setDate(s.getDate()-d);return{start_date:s.toISOString().split("T")[0],end_date:e.toISOString().split("T")[0]}}
const EP={daily_sleep:"v2/usercollection/daily_sleep",sleep:"v2/usercollection/sleep",daily_activity:"v2/usercollection/daily_activity",daily_readiness:"v2/usercollection/daily_readiness",heartrate:"v2/usercollection/heartrate",daily_spo2:"v2/usercollection/daily_spo2",daily_stress:"v2/usercollection/daily_stress",workouts:"v2/usercollection/workout",daily_resilience:"v2/usercollection/daily_resilience",daily_cardiovascular_age:"v2/usercollection/daily_cardiovascular_age",vo2_max:"v2/usercollection/vo2_max"};
async function fetchType(token,type,days){
  const r=dateRange(days);
  const p=type==="heartrate"?{start_datetime:`${r.start_date}T00:00:00+00:00`,end_datetime:`${r.end_date}T23:59:59+00:00`}:r;
  const res=await ouraFetch(EP[type],token,p);return res.data||[];
}
async function fetchAll(token,days=30){
  const types=["daily_sleep","daily_activity","daily_readiness","daily_spo2","daily_stress","daily_resilience"];
  const results=await Promise.allSettled(types.map(t=>fetchType(token,t,days)));
  const d={};types.forEach((t,i)=>{if(results[i].status==="fulfilled")d[t]=results[i].value});
  try{d.sleep=await fetchType(token,"sleep",7)}catch{}
  return d;
}

// ── Helpers ──
const fmtDur=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}m`:`${m}m`};
const fmtTime=iso=>new Date(iso).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
const scoreClr=s=>s==null?"#8888a0":s>=85?"#34d399":s>=70?"#fbbf24":"#f87171";
const avg=(arr,k)=>{const v=arr?.filter(x=>x[k]!=null);return v?.length?Math.round(v.reduce((a,b)=>a+b[k],0)/v.length):null};
const h=tag=>document.createElement(tag);
const txt=t=>document.createTextNode(t);

// ── Chart drawing on Canvas ──
function drawLineChart(canvas,datasets,labels,opts={}){
  const ctx=canvas.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth,H=opts.height||220;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.height=H+"px";
  ctx.scale(dpr,dpr);
  const pad={t:20,r:20,b:30,l:50};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;

  // Find min/max
  let min=opts.min??Infinity,max=opts.max??-Infinity;
  if(min===Infinity||max===-Infinity){
    datasets.forEach(ds=>{ds.data.forEach(v=>{if(v!=null){min=Math.min(min,v);max=Math.max(max,v)}})});
    const range=max-min||1;min-=range*.1;max+=range*.1;
  }

  // Grid
  ctx.strokeStyle="#2a2a3e";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.t+ch*(1-i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle="#8888a0";ctx.font="10px system-ui";ctx.textAlign="right";
    ctx.fillText(Math.round(min+(max-min)*i/4),pad.l-6,y+4);
  }

  // X labels
  ctx.textAlign="center";ctx.fillStyle="#8888a0";
  const step=Math.max(1,Math.floor(labels.length/8));
  labels.forEach((l,i)=>{if(i%step===0)ctx.fillText(l,pad.l+cw*i/(labels.length-1||1),H-8)});

  // Lines
  datasets.forEach(ds=>{
    ctx.strokeStyle=ds.color;ctx.lineWidth=2;ctx.beginPath();
    let started=false;
    ds.data.forEach((v,i)=>{
      if(v==null)return;
      const x=pad.l+cw*i/(labels.length-1||1);
      const y=pad.t+ch*(1-(v-min)/(max-min||1));
      if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y);
    });
    ctx.stroke();

    // Area fill
    if(ds.fill){
      ctx.globalAlpha=.1;ctx.fillStyle=ds.color;
      ctx.lineTo(pad.l+cw*(ds.data.length-1)/(labels.length-1||1),pad.t+ch);
      ctx.lineTo(pad.l,pad.t+ch);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
    }
  });
}

function drawBarChart(canvas,datasets,labels,opts={}){
  const ctx=canvas.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth,H=opts.height||220;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.height=H+"px";
  ctx.scale(dpr,dpr);
  const pad={t:20,r:20,b:30,l:50};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const stacked=opts.stacked;

  let max=0;
  if(stacked){
    labels.forEach((_,i)=>{let sum=0;datasets.forEach(ds=>{sum+=(ds.data[i]||0)});max=Math.max(max,sum)});
  }else{
    datasets.forEach(ds=>{ds.data.forEach(v=>{max=Math.max(max,v||0)})});
  }
  max=max*1.1||1;

  ctx.strokeStyle="#2a2a3e";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.t+ch*(1-i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle="#8888a0";ctx.font="10px system-ui";ctx.textAlign="right";
    ctx.fillText(Math.round(max*i/4),pad.l-6,y+4);
  }

  const bw=Math.min(cw/labels.length*.6,30);
  const gw=datasets.length>1&&!stacked?bw/datasets.length:bw;

  ctx.textAlign="center";ctx.fillStyle="#8888a0";
  const step=Math.max(1,Math.floor(labels.length/10));
  labels.forEach((l,i)=>{
    const cx=pad.l+cw*(i+.5)/labels.length;
    if(i%step===0)ctx.fillText(l,cx,H-8);

    if(stacked){
      let cumY=0;
      datasets.forEach(ds=>{
        const v=ds.data[i]||0;
        const bh=ch*v/max;
        ctx.fillStyle=ds.color;
        ctx.beginPath();
        const x=cx-bw/2,y=pad.t+ch-cumY-bh;
        ctx.roundRect?ctx.roundRect(x,y,bw,bh,cumY===0?[4,4,0,0]:[0,0,0,0]):ctx.rect(x,y,bw,bh);
        ctx.fill();
        cumY+=bh;
      });
    }else{
      datasets.forEach((ds,di)=>{
        const v=ds.data[i]||0;
        const bh=ch*v/max;
        ctx.fillStyle=ds.color;
        const x=cx-bw/2+(gw*di);
        const y=pad.t+ch-bh;
        ctx.beginPath();
        ctx.roundRect?ctx.roundRect(x,y,gw*.9,bh,[4,4,0,0]):ctx.rect(x,y,gw*.9,bh);
        ctx.fill();
      });
    }
  });
}

// ── Score Ring SVG ──
function createRing(score,size=120,sw=8){
  const r=(size-sw)/2,c=2*Math.PI*r,p=score!=null?(score/100)*c:0;
  const wrap=h("div");wrap.className="ring-wrap";wrap.style.width=wrap.style.height=size+"px";
  wrap.innerHTML=`<svg width="${size}" height="${size}" class="score-ring">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2a2a3e" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${scoreClr(score)}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c-p}" style="transition:stroke-dashoffset 1s"/>
  </svg><div class="ring-text" style="font-size:${size>80?24:14}px">${score??"\u2014"}</div>`;
  return wrap;
}

// ── UI Builders ──
function card(title,subtitle){const c=h("div");c.className="card";
  if(title){const t=h("div");t.className="card-title";t.textContent=title;c.appendChild(t)}
  if(subtitle){const s=h("div");s.className="card-sub";s.textContent=subtitle;c.appendChild(s)}
  return c;
}
function metric(label,value,unit,color){
  const c=card();
  const l=h("div");l.className="metric-label";l.textContent=label;c.appendChild(l);
  const v=h("span");v.className="metric-val";v.style.color=color||"var(--t1)";v.textContent=value??"\u2014";c.appendChild(v);
  if(unit){const u=h("span");u.className="metric-unit";u.textContent=unit;c.appendChild(u)}
  return c;
}
function dateSel(current,onChange){
  const d=h("div");d.className="date-sel";
  [7,14,30,90].forEach(n=>{const b=h("button");b.textContent=n+"D";if(n===current)b.className="active";
    b.onclick=()=>onChange(n);d.appendChild(b)});
  return d;
}
function spinner(msg="Loading data..."){const d=h("div");d.className="spinner";d.innerHTML=`<div class="dot"></div><p>${msg}</p>`;return d}
function errorBox(msg){const d=h("div");d.className="error-box";d.textContent=msg;return d}
function chartCard(title,subtitle,height,drawFn){
  const c=card(title,subtitle);
  const wrap=h("div");wrap.className="chart-container";
  const cv=h("canvas");cv.style.height=height+"px";wrap.appendChild(cv);c.appendChild(wrap);
  requestAnimationFrame(()=>{if(cv.clientWidth>0)drawFn(cv)});
  new ResizeObserver(()=>{if(cv.clientWidth>0)drawFn(cv)}).observe(wrap);
  return c;
}
function contribs(obj){
  const c=card("Score Contributors");const w=h("div");w.className="contribs";
  Object.entries(obj).forEach(([k,v])=>{
    const d=h("div");d.className="contrib";d.appendChild(createRing(v,52,4));
    const s=h("span");s.textContent=k.replace(/_/g," ");d.appendChild(s);w.appendChild(d);
  });c.appendChild(w);return c;
}
function grid(cols,...children){const g=h("div");g.className=`grid g${cols}`;children.forEach(c=>{if(c)g.appendChild(c)});return g}
function pageHeader(title,sub,days,onDays){
  const ph=h("div");ph.className="page-header";
  const left=h("div");const t=h("h2");t.textContent=title;left.appendChild(t);
  if(sub){const p=h("p");p.textContent=sub;left.appendChild(p)}
  ph.appendChild(left);if(days!=null)ph.appendChild(dateSel(days,onDays));return ph;
}

// ── State ──
let TOKEN=localStorage.getItem("oura_token");
let ANTHROPIC_KEY=localStorage.getItem("anthropic_key")||"";
let currentPage="overview";
const cache={};

async function loadData(type,days){
  const key=`${type}_${days}`;
  if(cache[key])return cache[key];
  const d=await fetchType(TOKEN,type,days);
  cache[key]=d;return d;
}
function clearCache(){Object.keys(cache).forEach(k=>delete cache[k])}

// ── Pages ──
async function renderOverview(container,days=14){
  container.innerHTML="";container.appendChild(spinner());
  try{
    const[sleep,activity,readiness]=await Promise.all([loadData("daily_sleep",days),loadData("daily_activity",days),loadData("daily_readiness",days)]);
    container.innerHTML="";
    container.appendChild(pageHeader("Dashboard Overview","Your health at a glance",days,d=>renderOverview(container,d)));
    const ls=sleep[sleep.length-1],la=activity[activity.length-1],lr=readiness[readiness.length-1];

    // Score rings
    const rings=grid(3);
    [["Sleep",ls?.score,avg(sleep,"score")],["Activity",la?.score,avg(activity,"score")],["Readiness",lr?.score,avg(readiness,"score")]].forEach(([label,score,avgS])=>{
      const c=card();c.style.display="flex";c.style.flexDirection="column";c.style.alignItems="center";c.style.padding="24px 0";
      c.appendChild(createRing(score,140));
      const p=h("p");p.style.cssText="font-size:14px;font-weight:500;margin-top:12px";p.textContent=label+" Score";c.appendChild(p);
      const a=h("p");a.style.cssText="font-size:12px;color:var(--t2)";a.innerHTML=`Avg: <span style="color:${scoreClr(avgS)}">${avgS??"\u2014"}</span>`;c.appendChild(a);
      rings.appendChild(c);
    });
    container.appendChild(rings);

    // Quick stats
    container.appendChild(grid(4,
      metric("Steps Today",la?.steps?.toLocaleString(),null,"var(--blue)"),
      metric("Avg Daily Steps",avg(activity,"steps")?.toLocaleString(),null,"var(--cyan)"),
      metric("Active Calories",la?.active_calories,"cal","var(--green)"),
      metric("Avg Calories",avg(activity,"active_calories"),"cal","var(--yellow)")
    ));

    // Score trends
    const labels=sleep.map(s=>s.day.slice(5));

    const daysList=Object.keys(byDay).sort();
    const latestDay=daysList[daysList.length-1];

function renderChat(container){
  container.innerHTML="";
  const page=h("div");page.id="chat-page";
  const header=h("div");header.style.marginBottom="16px";
  header.innerHTML=`<h2 style="font-size:24px;font-weight:700">Health Chat</h2><p style="font-size:13px;color:var(--t2);margin-top:4px">Ask questions about your Oura data. Powered by Claude AI.</p>`;
  page.appendChild(header);

  // API key
  if(!ANTHROPIC_KEY){
    const row=h("div");row.className="api-key-row";
    const inp=h("input");inp.type="password";inp.placeholder="Anthropic API Key (required for chat)";
    const btn=h("button");btn.textContent="Save";
    btn.onclick=()=>{if(inp.value.trim()){ANTHROPIC_KEY=inp.value.trim();localStorage.setItem("anthropic_key",ANTHROPIC_KEY);row.remove()}};
    row.appendChild(inp);row.appendChild(btn);page.appendChild(row);
  }

  const msgs=h("div");msgs.id="chat-messages";
  const messages=[];
  let ouraData=null;

  // Load data
  fetchAll(TOKEN).then(d=>{ouraData=d}).catch(()=>{});

  const suggestions=["How has my sleep quality been this week?","What trends do you see in my readiness scores?","How many steps am I averaging daily?","Is my HRV improving or declining?","What can I do to improve my sleep?","Compare my deep sleep to REM sleep","Am I getting enough recovery?","Summarize my health data"];

  function renderEmpty(){
    msgs.innerHTML="";
    const empty=h("div");empty.className="chat-empty";
    empty.innerHTML=`<div><div class="icon">\u2749</div><h3>Ask about your health data</h3><p>I can analyze your sleep, activity, readiness, heart rate, HRV, and more.</p></div>`;
    const sg=h("div");sg.className="chat-suggestions";
    suggestions.forEach(q=>{const b=h("button");b.textContent=q;b.onclick=()=>send(q);sg.appendChild(b)});
    empty.appendChild(sg);msgs.appendChild(empty);
  }

  function addMsg(role,text){
    messages.push({role,content:text});
    const d=h("div");d.className="msg "+(role==="user"?"user":"ai");
    const b=h("div");b.className="bubble";b.textContent=text;d.appendChild(b);
    msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  }

  async function send(content){
    if(!content.trim())return;
    if(!ANTHROPIC_KEY){alert("Please enter your Anthropic API key first.");return}
    if(messages.length===0)msgs.innerHTML="";
    addMsg("user",content);
    formInput.value="";

    // Typing indicator
    const typing=h("div");typing.className="msg ai";
    typing.innerHTML=`<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    msgs.appendChild(typing);msgs.scrollTop=msgs.scrollHeight;
    formBtn.disabled=true;

    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_KEY,"anthropic-dangerous-direct-browser-access":"true","anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1024,
          system:`You are an expert health analyst with access to Oura Ring data. Be conversational, reference specific data points, give actionable advice.\n\nDATA:\n${JSON.stringify(ouraData||{})}\n\nToday: ${new Date().toISOString().split("T")[0]}`,
          messages:messages.map(m=>({role:m.role,content:m.content}))})});
      typing.remove();
      const data=await r.json();
      if(!r.ok)throw new Error(data.error?.message||"API error "+r.status);
      const text=data.content?.filter(c=>c.type==="text").map(c=>c.text).join("")||"No response";
      addMsg("assistant",text);
    }catch(e){
      typing.remove();
      const err=h("div");err.style.cssText="text-align:center;padding:8px 16px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;font-size:13px;color:var(--red);margin:0 auto";
      err.textContent=e.message;msgs.appendChild(err);
    }
    formBtn.disabled=false;
  }

  renderEmpty();
  page.appendChild(msgs);

  const form=h("form");form.id="chat-form";
  const formInput=h("input");formInput.type="text";formInput.placeholder="Ask about your health data...";
  const formBtn=h("button");formBtn.type="submit";formBtn.textContent="Send";
  form.appendChild(formInput);form.appendChild(formBtn);
  form.onsubmit=e=>{e.preventDefault();send(formInput.value)};
  page.appendChild(form);
  container.appendChild(page);
}

    <li>Copy the worker URL and paste it above</li>
  </ol>
  <pre style="background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:16px;font-size:11px;color:var(--t1);overflow-x:auto;margin-top:8px;white-space:pre-wrap">export default {
  async fetch(request) {
    const url = new URL(request.url);
    const target = url.searchParams.get("url");
    if (!target) return new Response("Missing ?url= param", { status: 400 });

    const headers = new Headers();
    // Forward auth header
    if (request.headers.get("Authorization"))
      headers.set("Authorization", request.headers.get("Authorization"));

    const resp = await fetch(target, { headers });
    const body = await resp.text();

    return new Response(body, {
      status: resp.status,
      headers: {
        "Content-Type": resp.headers.get("Content-Type") || "application/json",
        "Access-Control-Allow-Origin": "*",
        "Access-Control-Allow-Headers": "Authorization, Content-Type",
      },
    });
  },
};</pre>`;
  pc.appendChild(workerInfo);
  wrap.appendChild(pc);

  // Anthropic key
  const ac=card("Anthropic API Key (for Chat)","Required for the AI chat feature. Calls Claude directly from your browser.");
  const akRow=h("div");akRow.style.cssText="display:flex;gap:8px";
  const akInp=h("input");akInp.type="password";akInp.value=ANTHROPIC_KEY;akInp.placeholder="sk-ant-...";
  akInp.style.cssText="flex:1;padding:10px 14px;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;font-size:13px;color:var(--t1);outline:none";
  const akBtn=h("button");akBtn.textContent="Save";akBtn.style.cssText="padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:13px";
  const akStatus=h("p");akStatus.style.cssText="font-size:12px;color:var(--t2);margin-top:8px";akStatus.textContent=ANTHROPIC_KEY?"Key configured":"No key set";
  akBtn.onclick=()=>{ANTHROPIC_KEY=akInp.value.trim();localStorage.setItem("anthropic_key",ANTHROPIC_KEY);akStatus.textContent="Saved!";akStatus.style.color="var(--green)"};
  akRow.appendChild(akInp);akRow.appendChild(akBtn);ac.appendChild(akRow);ac.appendChild(akStatus);
  wrap.appendChild(ac);

  // Oura token
  const tc=card("Oura Token");
  const tokenInfo=h("p");tokenInfo.style.cssText="font-size:12px;color:var(--t2);margin-bottom:12px";tokenInfo.textContent="Your token is stored locally in your browser.";
  tc.appendChild(tokenInfo);
  const dcBtn=h("button");dcBtn.textContent="Disconnect Ring";dcBtn.style.cssText="padding:8px 16px;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:8px;font-size:13px";
  dcBtn.onclick=()=>{TOKEN=null;localStorage.removeItem("oura_token");clearCache();renderApp()};
  tc.appendChild(dcBtn);
  wrap.appendChild(tc);

  container.appendChild(wrap);
}

// ── Router ──
const PAGES={overview:renderOverview,sleep:renderSleep,activity:renderActivity,readiness:renderReadiness,heartrate:renderHeartRate,body:renderBody,workouts:renderWorkouts,chat:renderChat,settings:renderSettings};
const NAV_ITEMS=[
  {id:"overview",label:"Overview",icon:"\u25C9"},
  {id:"sleep",label:"Sleep",icon:"\u263E"},
  {id:"activity",label:"Activity",icon:"\u2197"},
  {id:"readiness",label:"Readiness",icon:"\u2665"},
  {id:"heartrate",label:"Heart Rate",icon:"\u2764"},
  {id:"body",label:"Body",icon:"\u2726"},
  {id:"workouts",label:"Workouts",icon:"\u26A1"},
  {id:"chat",label:"Chat",icon:"\u2749"},
  {id:"settings",label:"Settings",icon:"\u2699"},
];

function navigate(pageId){
  currentPage=pageId;
  document.querySelectorAll("#nav .links button").forEach(b=>{b.classList.toggle("active",b.dataset.page===pageId)});
  const main=document.getElementById("main");
  PAGES[pageId](main);
}

function renderApp(){
  const app=document.getElementById("app");app.innerHTML="";

  if(!TOKEN){
    const setup=h("div");setup.id="setup";
    setup.innerHTML=`<div class="box"><h1>Oura Dashboard</h1><p class="sub">Enter your Oura Personal Access Token</p>
      <input type="password" id="token-input" placeholder="Paste your token here...">
      <button class="btn" id="token-btn" disabled>Connect Oura Ring</button>
      <p class="note">Your token is stored locally and never leaves your browser.</p></div>`;
    app.appendChild(setup);
    setTimeout(()=>{
      const inp=document.getElementById("token-input"),btn=document.getElementById("token-btn");
      inp.oninput=()=>{btn.disabled=!inp.value.trim()};
      btn.onclick=()=>{TOKEN=inp.value.trim();localStorage.setItem("oura_token",TOKEN);renderApp()};
    },0);
    return;
  }

  // Nav
  const nav=h("nav");nav.id="nav";
  nav.innerHTML=`<div class="logo"><h1>Oura Dashboard</h1><p>Health Analytics</p></div>`;
  const links=h("div");links.className="links";
  NAV_ITEMS.forEach(item=>{
    const b=h("button");b.dataset.page=item.id;
    b.innerHTML=`<span class="icon">${item.icon}</span>${item.label}`;
    if(item.id===currentPage)b.className="active";
    b.onclick=()=>navigate(item.id);
    links.appendChild(b);
  });
  nav.appendChild(links);
  const foot=h("div");foot.className="foot";
  const pw=h("p");pw.textContent="Powered by Oura API v2";foot.appendChild(pw);
  nav.appendChild(foot);
  app.appendChild(nav);

  const main=h("main");main.id="main";app.appendChild(main);
  PAGES[currentPage](main);
}

renderApp();
</script>
</body>
</html>
