// ── Oura API ──
const OURA="https://api.ouraring.com";
async function ouraFetch(endpoint,token,params={}){
  const url=new URL(`${OURA}/${endpoint}`);
  Object.entries(params).forEach(([k,v])=>{if(v)url.searchParams.set(k,v)});
  const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`}});
  if(!r.ok)throw new Error(`Oura API ${r.status}: ${await r.text()}`);
  return r.json();
}
function dateRange(days){
  const e=new Date(),s=new Date();s.setDate(s.getDate()-days);
  return{start_date:s.toISOString().split("T")[0],end_date:e.toISOString().split("T")[0]};
}
const ENDPOINTS={
  daily_sleep:"v2/usercollection/daily_sleep",
  sleep:"v2/usercollection/sleep",
  daily_activity:"v2/usercollection/daily_activity",
  daily_readiness:"v2/usercollection/daily_readiness",
  heartrate:"v2/usercollection/heartrate",
  daily_spo2:"v2/usercollection/daily_spo2",
  daily_stress:"v2/usercollection/daily_stress",
  workouts:"v2/usercollection/workout",
  daily_resilience:"v2/usercollection/daily_resilience",
  daily_cardiovascular_age:"v2/usercollection/daily_cardiovascular_age",
  vo2_max:"v2/usercollection/vo2_max",
  sessions:"v2/usercollection/session",
};
function useOura(type,days=14){
  const token=useContext(TokenCtx).token;
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  const fetchData=useCallback(async()=>{
    if(!token){setLoading(false);return}
    setLoading(true);setError(null);
    try{
      const ep=ENDPOINTS[type];if(!ep)throw new Error("Unknown:"+type);
      const range=dateRange(days);
      const params=type==="heartrate"
        ?{start_datetime:`${range.start_date}T00:00:00+00:00`,end_datetime:`${range.end_date}T23:59:59+00:00`}
        :range;
      const r=await ouraFetch(ep,token,params);
      setData(r.data||[]);
    }catch(e){setError(e.message)}finally{setLoading(false)}
  },[token,type,days]);
  useEffect(()=>{fetchData()},[fetchData]);
  return{data,loading,error,refetch:fetchData};
}
async function fetchAllData(token,days=30){
  const range=dateRange(days);
  const types=["daily_sleep","daily_activity","daily_readiness","daily_spo2","daily_stress","daily_resilience"];
  const results=await Promise.allSettled(types.map(async t=>{
    const r=await ouraFetch(ENDPOINTS[t],token,range);return{type:t,data:r.data};
  }));
  const all={};results.forEach(r=>{if(r.status==="fulfilled")all[r.value.type]=r.value.data});
  try{const s=await ouraFetch(ENDPOINTS.sleep,token,dateRange(7));all.sleep_periods=s.data}catch{}
  return all;
}

// ── Helpers ──

// ── Token Context ──
const TokenCtx=createContext({token:null,setToken:()=>{},clear:()=>{}});
function TokenProvider({children}){
  const[token,setT]=useState(()=>localStorage.getItem("oura_token"));

  const clear=()=>{localStorage.removeItem("oura_token");setT(null)};
  return React.createElement(TokenCtx.Provider,{value:{token,setToken,clear}},children);

function ChatPage(){
  const{token}=useContext(TokenCtx);
  const[messages,setMessages]=useState([]);
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);
  const[ouraData,setOuraData]=useState(null);
  const[loadingData,setLoadingData]=useState(true);
  const[apiKey,setApiKey]=useState(()=>localStorage.getItem("anthropic_key")||"");
  const endRef=useRef(null);
  const suggestions=["How has my sleep quality been this week?","What trends do you see in my readiness scores?","How many steps am I averaging daily?","Is my HRV improving or declining?","What can I do to improve my sleep?","Compare my deep sleep to REM sleep","Am I getting enough recovery?","Summarize my health data"];

  useEffect(()=>{if(token)fetchAllData(token,30).then(d=>{setOuraData(d);setLoadingData(false)}).catch(()=>setLoadingData(false));else setLoadingData(false)},[token]);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"})},[messages]);

  async function send(content){
    if(!content.trim()||loading)return;
    if(!apiKey.trim()){setError("Enter your Anthropic API key below to use chat.");return}
    setMessages(p=>[...p,{role:"user",content:content.trim()}]);
    setInput("");setLoading(true);setError(null);
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-dangerous-direct-browser-access":"true","anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1024,
          system:`You are an expert health analyst with access to Oura Ring data. Be conversational, reference specific data, give actionable advice. Data:\n${JSON.stringify(ouraData||{})}\nToday: ${new Date().toISOString().split("T")[0]}`,
          messages:[...messages,{role:"user",content:content.trim()}]})});
      const data=await r.json();
      if(!r.ok)throw new Error(data.error?.message||"API error");
      const text=data.content?.filter(c=>c.type==="text").map(c=>c.text).join("")||"No response";
      setMessages(p=>[...p,{role:"assistant",content:text}]);
    }catch(e){setError(e.message)}finally{setLoading(false)}
  }

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",height:"calc(100vh - 48px)"}},
    React.createElement("div",{style:{marginBottom:16}},
      React.createElement("h2",{style:{fontSize:24,fontWeight:700}},"Health Chat"),
      React.createElement("p",{style:{fontSize:13,color:"var(--text2)",marginTop:4}},"Ask questions about your Oura Ring data.",loadingData?" Loading data...":"")),
    // API key input
    !localStorage.getItem("anthropic_key")&&React.createElement("div",{style:{marginBottom:16,display:"flex",gap:8}},
      React.createElement("input",{type:"password",value:apiKey,onChange:e=>setApiKey(e.target.value),placeholder:"Anthropic API Key (for chat)",
        style:{flex:1,padding:"8px 12px",background:"var(--card)",border:"1px solid var(--border)",borderRadius:8,fontSize:13,color:"var(--text)",outline:"none"}}),
      React.createElement("button",{onClick:()=>{if(apiKey.trim())localStorage.setItem("anthropic_key",apiKey)},
        style:{padding:"8px 16px",background:"var(--blue)",color:"#fff",border:"none",borderRadius:8,fontSize:13,cursor:"pointer"}},"Save")),
    // Messages
    React.createElement("div",{style:{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:16,paddingBottom:16}},
      messages.length===0&&React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:24}},
        React.createElement("div",{style:{textAlign:"center"}},
          React.createElement("div",{style:{fontSize:40,marginBottom:12}},"\u2749"),
          React.createElement("h3",{style:{fontSize:18,fontWeight:600}},"Ask about your health data"),
          React.createElement("p",{style:{fontSize:13,color:"var(--text2)",marginTop:4,maxWidth:400}},"I can analyze your sleep, activity, readiness, heart rate, HRV, and more.")),
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,maxWidth:500,width:"100%"}},
          suggestions.map(q=>React.createElement("button",{key:q,onClick:()=>send(q),
            style:{textAlign:"left",fontSize:12,padding:12,background:"var(--card)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text2)",cursor:"pointer"}},q)))),
      messages.map((m,i)=>React.createElement("div",{key:i,style:{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}},
        React.createElement("div",{className:m.role==="user"?"chat-user":"chat-ai",
          style:{maxWidth:600,padding:"12px 16px",borderRadius:16,fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap",color:m.role==="user"?"#fff":"var(--text)"}},m.content))),
      loading&&React.createElement("div",{style:{display:"flex"}},
        React.createElement("div",{className:"chat-ai",style:{padding:"12px 16px",borderRadius:16,display:"flex",gap:4}},
          [0,150,300].map(d=>React.createElement("div",{key:d,className:"animate-bounce",style:{width:8,height:8,background:"var(--text2)",borderRadius:4,animationDelay:d+"ms"}})))),
      error&&React.createElement("div",{style:{textAlign:"center"}},
        React.createElement("div",{style:{display:"inline-block",padding:"8px 16px",background:"rgba(248,113,113,.1)",border:"1px solid rgba(248,113,113,.3)",borderRadius:8,fontSize:13,color:"var(--red)"}},error)),
      React.createElement("div",{ref:endRef})),
    // Input
    React.createElement("form",{onSubmit:e=>{e.preventDefault();send(input)},style:{display:"flex",gap:12,paddingTop:16,borderTop:"1px solid var(--border)"}},
      React.createElement("input",{type:"text",value:input,onChange:e=>setInput(e.target.value),placeholder:"Ask about your health data...",disabled:loading,
        style:{flex:1,padding:"12px 16px",background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,fontSize:14,color:"var(--text)",outline:"none",opacity:loading?.5:1}}),
      React.createElement("button",{type:"submit",disabled:loading||!input.trim(),
        style:{padding:"12px 24px",background:"linear-gradient(135deg,var(--blue),var(--purple))",color:"#fff",border:"none",borderRadius:12,fontSize:14,fontWeight:500,cursor:"pointer",opacity:loading||!input.trim()?.5:1}},"Send"))
  );
}
